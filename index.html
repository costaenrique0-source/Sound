<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#040a1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Glass Player">
<title>Glass Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#040a1f; --ink:#f3f0ff; --ink-2:#a9c0e6; --ink-3:#6c80a8;
  --glass:rgba(255,255,255,.065); --glass-2:rgba(255,255,255,.11);
  --line:rgba(130,180,255,.28); --cyan:#5ee7ff; --blue:#3f8cff; --violet:#6f8bff; --danger:#ff6b8b;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:
   radial-gradient(60% 40% at 90% 8%,rgba(63,140,255,.26),transparent 70%),
   radial-gradient(55% 45% at 5% 60%,rgba(74,125,255,.25),transparent 70%),
   radial-gradient(50% 35% at 85% 100%,rgba(60,200,255,.2),transparent 70%),
   radial-gradient(70% 50% at 20% 0%,rgba(90,120,255,.22),transparent 70%)}
.bg::before,.bg::after{content:"";position:absolute;inset:0;opacity:.7}
.bg::before{background-image:
  radial-gradient(circle,rgba(120,210,255,.9) 0 1.5px,transparent 2.5px),
  radial-gradient(circle,rgba(130,160,255,.85) 0 1px,transparent 2px),
  radial-gradient(circle,rgba(90,150,255,.85) 0 1.5px,transparent 2.5px);
  background-size:97px 113px,61px 73px,149px 131px;background-position:12px 30px,40px 8px,70px 90px;
  -webkit-mask-image:linear-gradient(#000,transparent 85%);mask-image:linear-gradient(#000,transparent 85%)}
.bg::after{background:
  linear-gradient(115deg,transparent 40%,rgba(80,150,255,.38) 49.6%,transparent 50.4%) -30% 20%/160% 30% no-repeat,
  linear-gradient(75deg,transparent 40%,rgba(94,231,255,.28) 49.6%,transparent 50.4%) 130% 80%/160% 30% no-repeat;filter:blur(1px)}
#app{position:relative;z-index:1;height:100%;max-width:520px;margin:0 auto;padding:12px 14px 10px;display:flex;flex-direction:column;gap:10px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:22px;-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 10px 40px rgba(2,10,45,.5)}
.btn-add{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:1.5px solid var(--blue);background:rgba(74,125,255,.12);font-weight:500;font-size:14px;box-shadow:0 0 14px rgba(74,125,255,.55),inset 0 0 12px rgba(74,125,255,.25);transition:transform .15s}
.btn-add:active{transform:scale(.96)}
.btn-add svg{width:18px;height:18px}
.add-sm{width:42px;height:42px;padding:0;justify-content:center;flex:none}
.views{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.toolbar{display:flex;gap:8px;flex:none;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:8px;padding:0 12px;height:42px;border-radius:14px}
.search svg{width:17px;height:17px;color:var(--ink-2);flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:14px}
.search input::placeholder{color:var(--ink-3)}
.mini{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;flex:none;color:var(--ink-2)}
.mini svg{width:16px;height:16px}
.mini[aria-pressed=true]{color:var(--cyan);border-color:rgba(94,231,255,.6);box-shadow:0 0 10px rgba(94,231,255,.35)}
.locked [data-act=add],.locked [data-act=more],.locked [data-act=account]{display:none!important}
.list{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:6px;padding:2px 2px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.row{display:flex;align-items:center;gap:11px;padding:8px;border-radius:16px;border:1px solid transparent;width:100%}
.row:active{background:var(--glass-2)}
.row.playing{background:linear-gradient(90deg,rgba(94,231,255,.13),rgba(63,140,255,.12));border-color:rgba(94,231,255,.4);box-shadow:0 0 18px rgba(94,231,255,.15)}
.row .main{flex:1;min-width:0;display:flex;align-items:center;gap:11px;text-align:left}
.cover{width:46px;height:46px;border-radius:13px;flex:none;background:linear-gradient(135deg,#1b3a95,#2f7bff 70%,#5ee7ff);display:grid;place-items:center;overflow:hidden;border:1px solid rgba(255,255,255,.18)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover svg{width:20px;height:20px;opacity:.9}
.meta{min-width:0;flex:1}
.t{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.playing .t{color:var(--cyan)}
.s{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.icon-btn svg{width:19px;height:19px}
.icon-btn:active{background:var(--glass-2)}
.empty{margin:auto;text-align:center;color:var(--ink-2);font-size:14px;line-height:1.5;padding:20px;max-width:300px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px;font-weight:600}
.empty .btn-add{margin-top:14px}
.now{flex:none;padding:12px 14px}
.now-top{display:flex;align-items:center;gap:12px}
.now .cover{width:54px;height:54px;border-radius:15px}
.now .t{font-size:15.5px}
.seek{display:flex;align-items:center;gap:9px;margin-top:10px;font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.seek span{width:34px;flex:none}
.seek span:last-child{text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:22px;background:transparent;margin:0;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:linear-gradient(90deg,var(--blue),var(--violet) calc(var(--p)*.6),var(--cyan) var(--p),rgba(255,255,255,.14) var(--p))}
input[type=range]::-moz-range-track{height:5px;border-radius:5px;background:rgba(255,255,255,.14)}
input[type=range]::-moz-range-progress{height:5px;border-radius:5px;background:linear-gradient(90deg,var(--blue),var(--cyan))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;margin-top:-5.5px;box-shadow:0 0 10px var(--cyan)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 10px var(--cyan)}
.ctrls{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:4px}
.ctrls .icon-btn{width:44px;height:44px}
.ctrls .icon-btn svg{width:22px;height:22px}
.play{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--cyan);background:radial-gradient(circle at 35% 30%,rgba(94,231,255,.35),rgba(74,125,255,.18));box-shadow:0 0 22px rgba(94,231,255,.5),inset 0 0 14px rgba(94,231,255,.25);transition:transform .15s}
.play:active{transform:scale(.94)}
.play svg{width:26px;height:26px}
nav{flex:none}
nav button{width:100%;height:52px;border-radius:16px;border:1px solid rgba(94,231,255,.55);background:var(--glass);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--cyan);box-shadow:0 0 14px rgba(94,231,255,.25),inset 0 0 10px rgba(94,231,255,.12)}
nav button svg{width:20px;height:20px}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(2,6,22,.65);display:none;align-items:flex-end;justify-content:center;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.overlay.open{display:flex}
.sheet{width:100%;max-width:520px;max-height:82%;overflow-y:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));border-radius:26px 26px 0 0;background:rgba(8,20,58,.94);border:1px solid var(--line);border-bottom:0;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet h3{margin:0 0 4px;font-size:17px;font-weight:600}
.sheet .sub{color:var(--ink-2);font-size:12.5px;margin-bottom:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act{display:flex;align-items:center;gap:12px;width:100%;padding:13px 6px;border-radius:12px;font-size:14.5px;text-align:left}
.act svg{width:20px;height:20px;color:var(--ink-2);flex:none}
.act:active{background:var(--glass-2)}
.act.danger,.act.danger svg{color:var(--danger)}
.field{display:block;margin-bottom:11px;font-size:12.5px;color:var(--ink-2)}
.field input,.field textarea{display:block;width:100%;margin-top:5px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.07);padding:0 12px;font-size:15px;color:var(--ink);outline:0}
.field input{height:44px}
.field textarea{height:150px;padding:10px 12px;font-size:12.5px;resize:none}
.field input:focus,.field textarea:focus{border-color:var(--cyan)}
.sheet .btn-add{width:100%;justify-content:center;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:30;padding:11px 16px;border-radius:14px;background:rgba(10,26,70,.96);border:1px solid var(--line);font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.gate{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:20px}
.gate.open{display:flex}
.gate .card{width:100%;max-width:400px;padding:24px 20px;text-align:center}
.gate h1{margin:0 0 8px;font-size:26px;font-weight:600;letter-spacing:-.02em}
.gate p{margin:0 0 16px;color:var(--ink-2);font-size:14px;line-height:1.5}
.gate .btn-add{width:100%;justify-content:center}
.gate .err{color:var(--danger);font-size:13px;margin-top:12px}
.gate .field{text-align:left}
@media (max-height:640px){.now{padding:9px 12px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<div id="app" hidden>
  <main class="views" id="views"></main>
  <section class="glass now" id="now" aria-label="Tocando agora"></section>
  <nav id="nav"><button type="button" id="navBtn"></button></nav>
</div>

<div class="gate" id="gate"><div class="glass card" id="gateCard"></div></div>

<input type="file" id="file" accept="audio/mpeg,audio/mp3,audio/*,.mp3" multiple hidden>
<div class="overlay" id="overlay"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {initializeFirestore,getFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,setDoc,updateDoc,deleteDoc,onSnapshot,getDocs,query,orderBy,writeBatch,Bytes} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

/* ============================================================
   CONFIGURAÇÃO DO FIREBASE
   Cole aqui o seu firebaseConfig OU deixe vazio e cole direto no
   app na primeira vez que abrir (ele pede e guarda).
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBUPzZiolfTpm1Bqj5FDABdB_eZGbhXOcw",
  authDomain: "sound-b70a1.firebaseapp.com",
  projectId: "sound-b70a1",
  storageBucket: "sound-b70a1.firebasestorage.app",
  messagingSenderId: "179243924625",
  appId: "1:179243924625:web:f6510b598eee82f28f5330"
};

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const I=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const IC={
 note:I('<path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>'),
 home:I('<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>'),
 more:I('<circle cx="12" cy="5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="19" r="1.2" fill="currentColor"/>'),
 search:I('<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/>'),
 play:I('<path d="M8 5v14l11-7z" fill="currentColor"/>'),
 pause:I('<rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/>'),
 next:I('<path d="M6 5v14l9-7zM18 5v14" fill="currentColor"/>'),
 prev:I('<path d="M18 5v14L9 12zM6 5v14" fill="currentColor"/>'),
 trash:I('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'),
 edit:I('<path d="M4 20h4L19 9l-4-4L4 16z"/>'),
 lock:I('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
 unlock:I('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/>'),
 user:I('<circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/>'),
 out:I('<path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M16 8l4 4-4 4M20 12H9"/>'),
 upload:I('<path d="M12 16V4M7 9l5-5 5 5M5 20h14" stroke-width="2"/>')
};
$('#navBtn').innerHTML=IC.home+'<span>Músicas</span>';

/* ---------- helpers ---------- */
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2800);}
const overlay=$('#overlay'), sheetEl=$('#sheet');
function openSheet(h){sheetEl.innerHTML=h;overlay.classList.add('open');return sheetEl}
function closeSheet(){overlay.classList.remove('open');sheetEl.innerHTML=''}
overlay.addEventListener('click',e=>{if(e.target===overlay)closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
const fmt=s=>{if(!isFinite(s)||s<0)s=0;return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')};
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* ---------- config / gate ---------- */
function getConfig(){
  if(FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.projectId) return FIREBASE_CONFIG;
  try{const c=JSON.parse(localStorage.getItem('gp-fbconfig')||'null'); if(c&&c.apiKey&&c.projectId) return c;}catch(e){}
  return null;
}
function parseConfig(txt){
  const out={}; const re=/([A-Za-z]+)\s*:\s*["']([^"']+)["']/g; let m;
  while((m=re.exec(txt))) out[m[1]]=m[2];
  return (out.apiKey&&out.projectId)?out:null;
}
function gate(html){ $('#gateCard').innerHTML=html; $('#gate').classList.add('open'); $('#app').hidden=true; }
const getCode=()=>{try{return localStorage.getItem('gp-code')||''}catch(e){return ''}};
function showSetup(err){
  const hasCfg=!!getConfig();
  gate(`<h1>Glass Player</h1><p>Configuração única neste aparelho.</p>
  ${hasCfg?'':`<label class="field">Configuração do Firebase<textarea id="cfgTxt" placeholder='const firebaseConfig = { apiKey: "...", authDomain: "...", projectId: "...", ... }'></textarea></label>`}
  <label class="field">Código secreto da biblioteca<input id="codeIn" placeholder="mínimo 8 letras ou números" autocomplete="off" autocapitalize="off" value="${esc(getCode())}"></label>
  <p style="font-size:12.5px;margin-bottom:12px">Use o mesmo código em todos os seus aparelhos para ver as mesmas músicas. Não compartilhe.</p>
  <button class="btn-add" id="cfgSave" type="button">Salvar e continuar</button>${err?`<div class="err">${esc(err)}</div>`:''}`);
  $('#cfgSave').onclick=()=>{
    const code=$('#codeIn').value.trim();
    if(!/^[A-Za-z0-9_-]{8,}$/.test(code)) return showSetup('O código precisa ter no mínimo 8 letras ou números, sem espaços.');
    if(!hasCfg){
      const c=parseConfig($('#cfgTxt').value);
      if(!c) return showSetup('Não consegui ler. Copie o bloco inteiro, com apiKey e projectId.');
      localStorage.setItem('gp-fbconfig',JSON.stringify(c));
    }
    localStorage.setItem('gp-code',code); location.reload();
  };
}

/* ---------- ID3 ---------- */
const dec=(enc,b)=>{try{let l='windows-1252';if(enc===1){if(b[0]===0xFF&&b[1]===0xFE){l='utf-16le';b=b.subarray(2)}else if(b[0]===0xFE&&b[1]===0xFF){l='utf-16be';b=b.subarray(2)}else l='utf-16le'}else if(enc===2)l='utf-16be';else if(enc===3)l='utf-8';return new TextDecoder(l).decode(b).replace(/\0+$/,'').split('\0')[0].trim()}catch(e){return ''}};
const ss=(b,p)=>((b[p]&127)<<21)|((b[p+1]&127)<<14)|((b[p+2]&127)<<7)|(b[p+3]&127);
async function readTags(file){
  const out={};
  try{
    const h=new Uint8Array(await file.slice(0,10).arrayBuffer());
    if(h[0]!==0x49||h[1]!==0x44||h[2]!==0x33) return out;
    const ver=h[3], size=ss(h,6);
    const buf=new Uint8Array(await file.slice(10,10+Math.min(size,14*1024*1024)).arrayBuffer());
    let p=0;
    if(ver>=3&&(h[5]&0x40)) p= ver===4?ss(buf,0):((buf[0]<<24|buf[1]<<16|buf[2]<<8|buf[3])>>>0)+4;
    const idL=ver===2?3:4, hL=ver===2?6:10;
    while(p+hL<=buf.length){
      let id=''; for(let k=0;k<idL;k++)id+=String.fromCharCode(buf[p+k]);
      if(!/^[A-Z0-9]+$/.test(id)) break;
      const fs= ver===2?(buf[p+3]<<16|buf[p+4]<<8|buf[p+5]): ver===4?ss(buf,p+4):((buf[p+4]<<24|buf[p+5]<<16|buf[p+6]<<8|buf[p+7])>>>0);
      if(fs<=0||p+hL+fs>buf.length) break;
      const d=buf.subarray(p+hL,p+hL+fs);
      if(id==='TIT2'||id==='TT2') out.title=dec(d[0],d.subarray(1));
      else if((id==='APIC'||id==='PIC')&&!out.cover){
        const enc=d[0]; let i=1, mime='';
        if(id==='PIC'){mime='image/'+String.fromCharCode(d[1],d[2],d[3]).toLowerCase();i=4}
        else{while(i<d.length&&d[i]!==0){mime+=String.fromCharCode(d[i]);i++}i++}
        i++;
        if(enc===1||enc===2){while(i+1<d.length&&!(d[i]===0&&d[i+1]===0))i+=2;i+=2}
        else{while(i<d.length&&d[i]!==0)i++;i++}
        if(!mime||mime==='image/jpg'||mime==='image/') mime='image/jpeg';
        if(i<d.length) out.cover=new Blob([d.slice(i)],{type:mime});
      }
      p+=hL+fs;
    }
  }catch(e){}
  return out;
}
function getDuration(file){return new Promise(res=>{const a=new Audio(),u=URL.createObjectURL(file);let done=false;const fin=v=>{if(done)return;done=true;URL.revokeObjectURL(u);res(v)};a.preload='metadata';a.onloadedmetadata=()=>fin(a.duration||0);a.onerror=()=>fin(0);setTimeout(()=>fin(0),8000);a.src=u})}

/* ---------- Firebase ---------- */
let fdb,uid=null,unsub=null;
let cloud=[], pending=[], tracks=[], loaded=false;
let term='', current=null, queue=[], qi=-1, curObjUrl=null, dragging=false, appIcon='';
let locked=false; try{locked=localStorage.getItem('gp-locked')==='1'}catch(e){}
document.body.classList.toggle('locked',locked);
const byId=id=>tracks.find(t=>t.id===id);
const tcol=()=>collection(fdb,'vault',uid,'tracks');
function rebuild(){
  const ids=new Set(pending.map(p=>p.id));
  tracks=[...pending,...cloud.filter(t=>!ids.has(t.id))].sort((a,b)=>b.added-a.added);
}
function startSync(){
  if(unsub) unsub(); loaded=false; cloud=[]; rebuild(); render();
  unsub=onSnapshot(tcol(),snap=>{
    cloud=snap.docs.map(d=>{const x=d.data();return {id:d.id,...x,coverUrl:x.cover||null}});
    const cids=new Set(cloud.map(c=>c.id));
    pending=pending.filter(p=>!cids.has(p.id)||p.uploading);
    loaded=true; rebuild(); render();
  },err=>{loaded=true;render();toast(err.code==='permission-denied'?'Sem permissão. Confira as regras do Firestore.':'Erro ao carregar: '+(err.code||err.message))});
}

/* ---------- list ---------- */
const coverHTML=t=>`<div class="cover">${t&&t.coverUrl?`<img src="${esc(t.coverUrl)}" alt="">`:IC.note}</div>`;
function rowHTML(t){
  return `<div class="row${current===t.id?' playing':''}" data-id="${t.id}">
   <button class="main" type="button" data-act="play" aria-label="Tocar ${esc(t.title)}">${coverHTML(t)}<span class="meta"><div class="t">${esc(t.title)}</div><div class="s">${t.pending?'Enviando '+Math.round((t.progress||0)*100)+'%':fmt(t.duration)}</div></span></button>
   <button class="icon-btn" type="button" data-act="more" aria-label="Mais opções">${IC.more}</button></div>`;
}
let lastList=[];
function renderView(){
  const el=$('#views');
  const kf=document.activeElement&&document.activeElement.id==='q', ss0=kf?document.activeElement.selectionStart:0;
  let list=tracks; if(term){const q=norm(term);list=tracks.filter(t=>norm(t.title).includes(q))}
  lastList=list;
  let h=`<div class="toolbar"><label class="glass search">${IC.search}<input id="q" type="search" placeholder="Buscar música" value="${esc(term)}" autocomplete="off"></label>
   <button class="btn-add add-sm" type="button" data-act="add" aria-label="Adicionar músicas">${IC.upload}</button>
   <button class="mini" type="button" data-act="account" aria-label="Conta">${IC.user}</button>
   <button class="mini" type="button" data-act="lock" aria-pressed="${locked}" aria-label="${locked?'Desbloquear edição':'Bloquear edição'}">${locked?IC.lock:IC.unlock}</button></div>`;
  if(!loaded) h+=`<div class="empty">Carregando suas músicas…</div>`;
  else if(!tracks.length) h+=`<div class="empty"><b>Sua biblioteca está vazia</b>Escolha os MP3 do celular. Eles são gravados no seu Firestore e ficam disponíveis em qualquer aparelho.<br><button class="btn-add" type="button" data-act="add">${IC.upload}Escolher músicas</button></div>`;
  else if(!list.length) h+=`<div class="empty"><b>Nada encontrado</b>Tente outro nome.</div>`;
  else h+=`<div class="list">${list.map(rowHTML).join('')}</div>`;
  el.innerHTML=h;
  if(kf){const q=$('#q');if(q){q.focus();try{q.setSelectionRange(ss0,ss0)}catch(e){}}}
}
function renderNow(){
  const t=current?byId(current):null, el=$('#now');
  if(!el.dataset.built){
    el.dataset.built='1';
    el.innerHTML=`<div class="now-top"><div id="nCover"></div><div class="meta"><div class="t" id="nTitle"></div><div class="s" id="nSub"></div></div></div>
    <div class="seek"><span id="nCur">0:00</span><input type="range" id="nSeek" min="0" max="1000" value="0" aria-label="Posição da música"><span id="nDur">0:00</span></div>
    <div class="ctrls"><button class="icon-btn" id="bPrev" type="button" aria-label="Anterior">${IC.prev}</button><button class="play" id="bPlay" type="button" aria-label="Tocar ou pausar"></button><button class="icon-btn" id="bNext" type="button" aria-label="Próxima">${IC.next}</button></div>`;
    $('#bPrev').onclick=prev; $('#bNext').onclick=()=>next(true); $('#bPlay').onclick=togglePlay;
    const sk=$('#nSeek');
    sk.addEventListener('input',()=>{dragging=true;setRange(sk);$('#nCur').textContent=fmt(sk.value/1000*(audio.duration||0))});
    sk.addEventListener('change',()=>{if(audio.duration)audio.currentTime=sk.value/1000*audio.duration;dragging=false});
  }
  $('#nCover').innerHTML=coverHTML(t);
  $('#nTitle').textContent=t?t.title:'Escolha uma música';
  $('#nSub').textContent=t?'Tocando agora':'Toque em uma música para começar';
  $('#nDur').textContent=fmt(t?(audio.duration||t.duration):0);
  $('#bPlay').innerHTML=(t&&!audio.paused)?IC.pause:IC.play;
  $('#nSeek').disabled=!t;
}
const setRange=sk=>sk.style.setProperty('--p',(sk.value/10)+'%');
function render(){renderView();renderNow()}

/* ---------- player ---------- */
const audio=new Audio(); audio.preload='auto'; audio.setAttribute('playsinline',''); audio.style.display='none'; document.body.appendChild(audio);
/* cache local dos áudios já baixados */
let adb;
const idb=()=>adb||(adb=new Promise(res=>{try{const r=indexedDB.open('gp-audio',1);r.onupgradeneeded=()=>r.result.createObjectStore('blobs');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}}));
async function idbOp(mode,fn){const d=await idb();if(!d)return null;return new Promise(r=>{try{const tx=d.transaction('blobs',mode);const q=fn(tx.objectStore('blobs'));tx.oncomplete=()=>r(q&&q.result!==undefined?q.result:true);tx.onerror=tx.onabort=()=>r(null)}catch(e){r(null)}})}
const ckey=id=>uid+':'+id;
const cacheGet=id=>idbOp('readonly',s=>s.get(ckey(id)));
const cachePut=(id,b)=>idbOp('readwrite',s=>s.put(b,ckey(id)));
const cacheDel=id=>idbOp('readwrite',s=>s.delete(ckey(id)));
const inflight=new Map();
function getAudioBlob(t,quiet){
  if(t.blob) return Promise.resolve(t.blob);
  if(inflight.has(t.id)) return inflight.get(t.id);
  const p=(async()=>{
    const c=await cacheGet(t.id); if(c&&c!==true) return c;
    if(!quiet) toast('Carregando música…');
    try{
      const snap=await getDocs(query(collection(fdb,'vault',uid,'tracks',t.id,'parts'),orderBy('i')));
      if(snap.size<(t.chunks||1)) return null;
      const b=new Blob(snap.docs.map(d=>d.data().data.toUint8Array()),{type:t.mime||'audio/mpeg'});
      cachePut(t.id,b); return b;
    }catch(e){return null}
  })().finally(()=>inflight.delete(t.id));
  inflight.set(t.id,p); return p;
}
let loadTok=0;
async function load(id){
  const t=byId(id); if(!t) return;
  const tok=++loadTok; current=id; setMedia(t); renderNow();
  document.querySelectorAll('.row[data-id]').forEach(r=>r.classList.toggle('playing',r.dataset.id===current));
  const blob=await getAudioBlob(t,false);
  if(tok!==loadTok) return;
  if(!blob){toast('Não consegui carregar esta música');return}
  if(curObjUrl)URL.revokeObjectURL(curObjUrl);
  curObjUrl=URL.createObjectURL(blob); audio.src=curObjUrl; audio.play().catch(()=>{});
  const q=queue.filter(x=>byId(x)); const nx=byId(q[(q.indexOf(id)+1)%q.length]);
  if(nx&&nx.id!==id) getAudioBlob(nx,true);
}
function playTrack(id,list){ if(list) queue=list.map(t=>t.id); if(!queue.includes(id)) queue=[id]; qi=queue.indexOf(id); load(id); }
function togglePlay(){
  if(!current){const f=lastList[0];if(f)playTrack(f.id,lastList);return}
  if(audio.paused) audio.play().catch(()=>{}); else audio.pause();
}
function next(manual){
  const q=queue.filter(id=>byId(id)); if(!q.length) return; queue=q;
  qi=(queue.indexOf(current)+1)%queue.length; load(queue[qi]);
}
function prev(){
  const q=queue.filter(id=>byId(id)); if(!q.length) return; queue=q;
  if(audio.currentTime>3){audio.currentTime=0;return}
  qi=(queue.indexOf(current)-1+queue.length)%queue.length; load(queue[qi]);
}
audio.addEventListener('ended',()=>next(false));
audio.addEventListener('play',()=>{renderNow();setState()});
audio.addEventListener('pause',()=>{renderNow();setState()});
audio.addEventListener('loadedmetadata',()=>{$('#nDur').textContent=fmt(audio.duration);setPos()});
let lastPos=0;
audio.addEventListener('timeupdate',()=>{
  if(!dragging&&audio.duration){const sk=$('#nSeek');sk.value=Math.round(audio.currentTime/audio.duration*1000);setRange(sk);$('#nCur').textContent=fmt(audio.currentTime)}
  const n=Date.now(); if(n-lastPos>5000){lastPos=n;setPos()}
});
audio.addEventListener('seeked',setPos);
audio.addEventListener('error',()=>{if(current){toast('Não consegui tocar esta música. Pulando…');setTimeout(()=>next(true),900)}});
function setState(){if('mediaSession' in navigator)navigator.mediaSession.playbackState=audio.paused?'paused':'playing'}
function setPos(){if('mediaSession' in navigator&&navigator.mediaSession.setPositionState&&audio.duration&&isFinite(audio.duration)){try{navigator.mediaSession.setPositionState({duration:audio.duration,playbackRate:audio.playbackRate,position:Math.min(audio.currentTime,audio.duration)})}catch(e){}}}
function setMedia(t){
  if(!('mediaSession' in navigator)) return;
  try{
    const ms=navigator.mediaSession;
    ms.metadata=new MediaMetadata({title:t.title,artist:'Glass Player',artwork:t.coverUrl?[{src:t.coverUrl,sizes:'512x512'}]:(appIcon?[{src:appIcon,sizes:'512x512',type:'image/png'}]:[])});
    ms.setActionHandler('play',()=>audio.play()); ms.setActionHandler('pause',()=>audio.pause());
    ms.setActionHandler('previoustrack',prev); ms.setActionHandler('nexttrack',()=>next(true));
    ms.setActionHandler('seekbackward',e=>{audio.currentTime=Math.max(0,audio.currentTime-(e.seekOffset||10))});
    ms.setActionHandler('seekforward',e=>{audio.currentTime=Math.min(audio.duration||0,audio.currentTime+(e.seekOffset||10))});
    ms.setActionHandler('seekto',e=>{if(e.seekTime!=null)audio.currentTime=e.seekTime});
  }catch(e){}
}

/* ---------- upload (Firestore, em partes) ---------- */
const CHUNK=850000, MAXMB=40;
const partId=i=>String(i).padStart(4,'0');
async function smallCover(blob){
  try{
    const bmp=await createImageBitmap(blob), k=Math.min(1,160/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(bmp.width*k)); c.height=Math.max(1,Math.round(bmp.height*k));
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height); return c.toDataURL('image/jpeg',.7);
  }catch(e){return null}
}
$('#file').addEventListener('change',async e=>{
  const files=[...e.target.files]; e.target.value='';
  if(locked||!files.length||!uid) return;
  let ok=0, fail=0, skip=0, big=0;
  for(let i=0;i<files.length;i++){
    const f=files[i];
    if(!(f.type.startsWith('audio/')||/\.(mp3|m4a|wav|ogg|flac|aac)$/i.test(f.name))||tracks.some(t=>t.name===f.name&&t.size===f.size)){skip++;continue}
    if(f.size>MAXMB*1024*1024){big++;continue}
    toast(`Enviando ${i+1} de ${files.length}…`);
    const tags=await readTags(f), dur=await getDuration(f), id=newId(), n=Math.ceil(f.size/CHUNK);
    const title=tags.title||f.name.replace(/\.[^.]+$/,'').replace(/_/g,' ');
    const t={id,name:f.name,size:f.size,title,duration:dur,added:Date.now()+i,blob:f,cover:tags.cover||null,pending:true,uploading:true,progress:0};
    if(t.cover) t.coverUrl=URL.createObjectURL(t.cover);
    pending.push(t); rebuild(); renderView();
    let written=0;
    try{
      for(let k=0;k<n;k++){
        const buf=new Uint8Array(await f.slice(k*CHUNK,(k+1)*CHUNK).arrayBuffer());
        await setDoc(doc(fdb,'vault',uid,'tracks',id,'parts',partId(k)),{i:k,data:Bytes.fromUint8Array(buf)});
        written=k+1; t.progress=written/n;
        const s=document.querySelector(`.row[data-id="${id}"] .s`); if(s)s.textContent='Enviando '+Math.round(t.progress*100)+'%';
      }
      const data={title,name:f.name,size:f.size,duration:dur,added:t.added,chunks:n,mime:f.type||'audio/mpeg'};
      const cv=t.cover?await smallCover(t.cover):null; if(cv) data.cover=cv;
      t.uploading=false; cachePut(id,f);
      setDoc(doc(fdb,'vault',uid,'tracks',id),data).catch(err=>toast('Não consegui salvar: '+(err.code||err.message)));
      ok++;
    }catch(err){
      pending=pending.filter(x=>x!==t); rebuild(); renderView(); fail++;
      try{const bt=writeBatch(fdb);for(let k=0;k<written;k++)bt.delete(doc(fdb,'vault',uid,'tracks',id,'parts',partId(k)));await bt.commit()}catch(x){}
      toast(err.code==='permission-denied'?'Sem permissão. Confira as regras do Firestore.':'Falha ao enviar '+f.name);
      await new Promise(r=>setTimeout(r,1800));
    }
  }
  const msg=[]; if(ok)msg.push(`${ok} enviada${ok===1?'':'s'}`); if(skip)msg.push(`${skip} ignorada${skip>1?'s':''} (repetida ou não é áudio)`); if(big)msg.push(`${big} grande demais (máx. ${MAXMB} MB)`); if(fail)msg.push(`${fail} com erro`);
  if(msg.length) toast(msg.join(' · '));
});

/* ---------- actions ---------- */
$('#views').addEventListener('input',e=>{if(e.target.id==='q'){term=e.target.value;renderView()}});
$('#views').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, row=b.closest('[data-id]'), id=row&&row.dataset.id;
  if(act==='lock'){locked=!locked;try{localStorage.setItem('gp-locked',locked?'1':'0')}catch(x){}document.body.classList.toggle('locked',locked);renderView();toast(locked?'Bloqueado: só o player funciona':'Desbloqueado');return}
  if(locked&&(act==='add'||act==='more'||act==='account')) return;
  if(act==='add') $('#file').click();
  else if(act==='play') playTrack(id,lastList);
  else if(act==='more') trackMenu(id);
  else if(act==='account') accountSheet();
});
function accountSheet(){
  const s=openSheet(`<h3>Biblioteca</h3><div class="sub">Código: ${esc(uid.slice(0,2))}••••${esc(uid.slice(-2))}</div><button class="act danger" data-a="out">${IC.out}Trocar código ou configuração</button>`);
  s.onclick=e=>{if(e.target.closest('[data-a=out]')){try{localStorage.removeItem('gp-code');localStorage.removeItem('gp-fbconfig')}catch(x){}location.reload()}};
}
function trackMenu(id){
  const t=byId(id); if(!t) return;
  if(t.pending){toast('Aguarde o envio terminar');return}
  const s=openSheet(`<h3>${esc(t.title)}</h3><div class="sub">Música</div>
   <button class="act" data-a="edit">${IC.edit}Editar nome da música</button>
   <button class="act danger" data-a="del">${IC.trash}Excluir da nuvem</button>`);
  s.onclick=e=>{
    const a=e.target.closest('[data-a]'); if(!a) return;
    if(a.dataset.a==='edit') editSheet(id);
    else if(a.dataset.a==='del'){
      if(!a.dataset.sure){a.dataset.sure='1';a.lastChild.textContent='Toque de novo para excluir';return}
      closeSheet(); deleteTrack(id);
    }
  };
}
function editSheet(id){
  const t=byId(id);
  openSheet(`<h3>Editar música</h3><div class="sub">Arquivo: ${esc(t.name)}</div>
   <label class="field">Nome da música<input id="eT" value="${esc(t.title)}"></label>
   <button class="btn-add" id="eSave" type="button">Salvar nome</button>`);
  setTimeout(()=>{const i=$('#eT');i.focus();i.select()},60);
  $('#eT').onkeydown=e=>{if(e.key==='Enter')$('#eSave').click()};
  $('#eSave').onclick=async()=>{
    const v=$('#eT').value.trim(); if(!v) return;
    closeSheet();
    try{await updateDoc(doc(fdb,'vault',uid,'tracks',id),{title:v});toast('Nome salvo')}catch(e){toast('Não consegui salvar o nome')}
  };
}
async function deleteTrack(id){
  const t=byId(id); if(!t) return;
  if(current===id){loadTok++;audio.pause();audio.removeAttribute('src');current=null}
  queue=queue.filter(x=>x!==id);
  try{
    await deleteDoc(doc(fdb,'vault',uid,'tracks',id));
    const n=t.chunks||0;
    for(let st=0;st<n;st+=400){const b=writeBatch(fdb);for(let k=st;k<Math.min(n,st+400);k++)b.delete(doc(fdb,'vault',uid,'tracks',id,'parts',partId(k)));await b.commit()}
    cacheDel(id); toast('Música excluída');
  }catch(e){toast('Não consegui excluir')}
}

/* ---------- app (PWA) ---------- */
(function(){
  try{
    const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');
    const g=x.createLinearGradient(0,0,512,512);g.addColorStop(0,'#0a1a52');g.addColorStop(.6,'#2f7bff');g.addColorStop(1,'#5ee7ff');
    x.fillStyle=g;x.fillRect(0,0,512,512);x.fillStyle='#fff';x.beginPath();x.ellipse(190,370,56,42,-.3,0,7);x.fill();x.fillRect(228,150,28,220);
    x.beginPath();x.moveTo(256,150);x.lineTo(380,120);x.lineTo(380,170);x.lineTo(256,205);x.fill();
    appIcon=c.toDataURL('image/png');
  }catch(e){}
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();

/* ---------- start ---------- */
(function init(){
  const cfg=getConfig(), code=getCode();
  if(!cfg||!code){ showSetup(); return; }
  try{
    const fapp=initializeApp(cfg);
    try{ fdb=initializeFirestore(fapp,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})}); }
    catch(e){ fdb=getFirestore(fapp); }
  }catch(e){ showSetup('Configuração inválida: '+(e.message||e)); return; }
  uid=code;
  $('#gate').classList.remove('open'); $('#app').hidden=false;
  startSync();
})();
</script>
